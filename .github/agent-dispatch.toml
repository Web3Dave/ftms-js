[playbooks.fix-pr]
agent   = "claude"
model   = "claude-sonnet-5-5"
allow   = "write-branch"
timeout = 20
tools   = [
  "Bash(pnpm install:*)",
  "Bash(pnpm add:*)",
  "Bash(pnpm update:*)",
  "Bash(pnpm view:*)",
  "Bash(pnpm why:*)",
  "Bash(pnpm check:*)",
  "Bash(pnpm typecheck:*)",
  "Bash(pnpm lint:*)",
  "Bash(pnpm test:*)",
  "Bash(pnpm test:coverage:*)",
  "Bash(pnpm format:*)",
  "Bash(pnpm format:check:*)",
  "Bash(pnpm build:*)",
]
