name: Release

# Manual release: Actions tab -> Release -> Run workflow (on main).
# Bumps the version, stages it on npm, then pushes the version commit, the tag and a GitHub release.
#
# Auth is npm trusted publishing (OIDC): no npm token is stored. The trusted publisher on npmjs.com must be
# limited to staged publishing. The staged version is NOT public until a maintainer approves it with 2FA
# (npmjs.com -> ftms-js -> Staged versions -> Approve, or `npm stage approve <stage-id>`).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump ("current" publishes the version already in package.json)
        type: choice
        options: [current, patch, minor, major]
        default: patch

permissions:
  contents: write # push the version commit and tag, create the release
  id-token: write # npm provenance (and trusted publishing later)

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # npm >= 11.5 is required for trusted publishing
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Update npm (npm stage needs >= 11.15)
        run: npm install -g npm@^11.15.0 && npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Bump version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          [ "$BUMP" = "current" ] || npm version "$BUMP" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists. Choose a bump."; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git diff --cached --quiet || git commit -m "v$VERSION"
          git tag "v$VERSION"

      - run: pnpm build
      - name: Stage on npm (needs maintainer approval)
        run: npm stage publish --provenance --access public

      - name: Push version commit and tag
        run: git push origin HEAD:main "v$VERSION"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --generate-notes --verify-tag
