name: Release

# Manual release: Actions tab -> Release -> Run workflow (on main).
# Bumps the version, publishes to npm, then pushes the version commit, the tag and a GitHub release.
#
# First publish uses the NPM_TOKEN secret. Once trusted publishing is linked on npmjs.com,
# delete the `env: NODE_AUTH_TOKEN` lines below and npm will authenticate via OIDC instead.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump ("current" publishes the version already in package.json)
        type: choice
        options: [current, patch, minor, major]
        default: patch

permissions:
  contents: write # push the version commit and tag, create the release
  id-token: write # npm provenance (and trusted publishing later)

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm >= 11.5 is required for trusted publishing
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Bump version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          [ "$BUMP" = "current" ] || npm version "$BUMP" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists. Choose a bump."; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git diff --cached --quiet || git commit -m "v$VERSION"
          git tag "v$VERSION"

      - run: pnpm build
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Push version commit and tag
        run: git push origin HEAD:main "v$VERSION"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --generate-notes --verify-tag
