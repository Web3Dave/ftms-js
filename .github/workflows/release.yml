name: Release

# Manual release: Actions tab -> Release -> Run workflow (on main).
# Publishes the version already in package.json on main, so bump it first in a normal PR
# (`npm version <patch|minor|major> --no-git-tag-version`). main is protected, so this workflow never pushes
# commits to it: it stages the version on npm, then pushes the tag and creates a GitHub release.
#
# Auth is npm trusted publishing (OIDC): no npm token is stored. The trusted publisher on npmjs.com must be
# limited to staged publishing. The staged version is NOT public until a maintainer approves it with 2FA
# (npmjs.com -> ftms-js -> Staged versions -> Approve, or `npm stage approve <stage-id>`).

on:
  workflow_dispatch:

permissions:
  contents: write # push the tag, create the release
  id-token: write # npm provenance (and trusted publishing later)

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # npm >= 11.5 is required for trusted publishing
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Update npm (npm stage needs >= 11.15)
        run: npm install -g npm@^11.15.0 && npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Read version and tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists. Bump the version in package.json via a PR first."; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"

      - run: pnpm build
      - name: Stage on npm (needs maintainer approval)
        run: npm stage publish --provenance --access public

      - name: Push tag
        run: git push origin "v$VERSION"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --generate-notes --verify-tag
